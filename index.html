<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=projects/rope2sink/">
  <link rel="canonical" href="https://freemty.github.io/projects/rope2sink/">
  <title>From a Spiral to a Sink</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --text: #f4f0ea;
      --muted: #a8a29a;
      --accent: #d3162c;
      --border: rgba(244, 240, 234, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(640px, calc(100vw - 40px));
      border-top: 3px solid var(--accent);
      padding: 28px 0 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--border);
      padding: 0 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Project Page</p>
    <h1>From a Spiral to a Sink</h1>
    <p>Redirecting to the project page.</p>
    <a href="projects/rope2sink/">Open Project Page</a>
  </main>
  <script>
    const target = new URL("projects/rope2sink/", window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</body>
</html>
