# Robobench pipeline: one row per task, one column per stage.
# Add a task by adding a row. Cell values: done | wip | todo | stale | skip, or {s: <value>, note: "..."}.
# stale = built on the old (v0) design, which was wrong; it has to be redone after the redesign.
# `scene:` names the folder scenes/<scene>/ that holds DESIGN.md and keys.yaml; the dashboard opens both once they exist.
updated: 2026-11-07
sections:
  - {key: design, label: "A · Design", help: "Understand the task before building it: the story, the ideal procedure, the hard parts, and a three.js animation."}
  - {key: env, label: "B · Env", help: "Build it in Isaac Lab and prove a scripted policy can do it."}
  - {key: eval, label: "C · Eval", help: "Measure agents on it and show it."}
stages:
  - {key: idea, section: design, label: Idea, help: "The task is written down: what is tested and why."}
  - {key: design, section: design, label: Design, help: "DESIGN.md: the story in detail, one ideal procedure step by step, and the challenges (friction, weight, damage, stepping on someone, timing)."}
  - {key: anim, section: design, label: Animation, help: "A keyframed three.js animation of G1s doing the ideal procedure, with reach, joint-limit and per-hand load checks."}
  - {key: sim, section: env, label: Sim env, help: "An Isaac Lab env runs on GB200."}
  - {key: scripted, section: env, label: Scripted, help: "A scripted policy clearly beats the zero policy, and the GPU smoke test encodes that."}
  - {key: eval, section: eval, label: Agent eval, help: "At least one learned or LLM agent has been evaluated against the scripted baseline."}
  - {key: demo, section: eval, label: Demo, help: "A rendered demo is ready to show people."}
groups:
  - {key: rescue, label: Rescue scenes, note: "G1 pairs, animation first. Animations exist but need edits; design docs being written."}
  - {key: v0, label: "v0 tasks: redo", note: "Built on main with abstract effectors. Not done; every stage is redone from a new design."}
  - {key: ideas, label: New ideas, note: "Proposed 2026-11-06, not yet designed."}
  - {key: batch-a, label: "Batch A: dynamic and long", note: "v0 on branch tasks/a. Being redesigned."}
  - {key: batch-b, label: "Batch B: precision and repair", note: "v0 on branch tasks/b. Being redesigned."}
  - {key: batch-c, label: "Batch C: art and wet lab", note: "v0 on branch tasks/c. Being redesigned."}
  - {key: batch-d, label: "Batch D: collaboration", note: "v0 on branch tasks/d. Being redesigned."}
  - {key: batch-e, label: "Batch E: team logistics", note: "v0 on branch tasks/e. Being redesigned."}
  - {key: batch-f, label: "Batch F: ball sports", note: "v0 on branch tasks/f. Being redesigned."}
  - {key: batch-g, label: "Batch G: arena", note: "v0 on branch tasks/g. Being redesigned."}
  - {key: batch-h, label: "Batch H: NVL72 datacenter", note: "v0 on branch tasks/h. Being redesigned."}
tasks:
  - id: SheetTransfer
    group: rescue
    scene: 01_sheet_transfer
    agents: "2 G1"
    what: "Move a 50 kg patient from the gurney to the OR table on a slide sheet with handle bars"
    metric: "patient centered on the table, peak tilt, falls"
    where: main (robobench/envs/collab/patient_transfer)
    stages:
      idea: done
      design: todo
      anim: {s: wip, note: "Reach is clean, but the motion needs edits after the redesign (load: a 50 kg patient on two G1s)."}
      sim: {s: wip, note: "PatientTransfer env with handle bars on the sheet runs on GB200."}
      scripted: {s: wip, note: "A downward pull over the table edge moves the sheet 25–28 cm per stroke, but the G1 falls backward at the bottom of the squat."}
      eval: todo
      demo: {s: wip, note: "Three.js replay of the sim exists (scripts/replay)."}
