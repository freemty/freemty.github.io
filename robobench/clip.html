<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#111}video{width:100%;height:100%;object-fit:contain;display:block}</style>
</head><body><video id="v" muted loop autoplay playsinline controls></video>
<script>
const set = () => { const s = location.hash.slice(1).replace(/[^a-z0-9_]/g, ''); const v = document.getElementById('v'); v.poster = `clips/${s}.jpg`; v.src = `clips/${s}.webm`; };
addEventListener('hashchange', set); set();
</script></body></html>
